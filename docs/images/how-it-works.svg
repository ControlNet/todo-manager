<rect class="card-h" x="1376" y="214" width="32" height="20" rx="3"/>
<rect class="slot-h" x="1416" y="214" width="32" height="20" rx="3"/>
<line class="drag" x1="1432" y1="187" x2="1432" y2="212" marker-end="url(#head-agent)"/>
