<text class="agent-label" x="1448" y="136" text-anchor="end">you drag cards</text>
<text class="small" x="1200" y="181">To decide</text>
<rect class="card" x="1336" y="166" width="32" height="20" rx="3"/>
<rect class="card" x="1376" y="166" width="32" height="20" rx="3"/>
<rect class="card" x="1416" y="166" width="32" height="20" rx="3"/>
<text class="small" x="1200" y="229">Agent work</text>
