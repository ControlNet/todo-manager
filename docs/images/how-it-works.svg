<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="600" viewBox="0 0 1536 600" role="img" aria-labelledby="title desc">
<title id="title">How Todo Manager works</title>
<desc id="desc">Gmail, Slack and GitHub are read by Todo Manager's wake gate every five minutes. Only new material wakes the Hermes LLM judge, which writes task changes to the local store. Notion sync keeps the store and the Notion home and task pages in step. A card dragged to Agent work is delegated to a Hermes Kanban agent, whose results and questions come back to Notion.</desc>
<style>
  text { font-family: 'Times New Roman', Times, 'Liberation Serif', 'Nimbus Roman', serif; fill: #111827; }
  .h1 { font-size: 28px; font-weight: 700; }
  .lane-tm-label { font-size: 24px; font-weight: 700; fill: #1D4ED8; }
  .lane-h-label { font-size: 24px; font-weight: 700; fill: #B45309; }
  .title { font-size: 26px; font-weight: 700; text-anchor: middle; }
  .sub { font-size: 20px; fill: #4B5563; text-anchor: middle; }
  .item { font-size: 26px; }
  .small { font-size: 20px; fill: #4B5563; }
  .edge-label { font-size: 20px; font-style: italic; fill: #4B5563; }
  .agent-label { font-size: 20px; font-style: italic; fill: #B45309; }
  .page-title { font-size: 22px; font-weight: 700; }
  .tm-text { font-size: 20px; fill: #1D4ED8; }
  .h-text { font-size: 20px; fill: #B45309; }
  .region { fill: #F9FAFB; stroke: #D1D5DB; stroke-width: 1.5; }
  .lane-tm { fill: #EFF4FF; stroke: #C7D7FE; stroke-width: 1.5; }
  .lane-h { fill: #FFF4EA; stroke: #FAD2AE; stroke-width: 1.5; }
  .op-tm { fill: #FFFFFF; stroke: #1D4ED8; stroke-width: 2; }
  .op-h { fill: #FFFFFF; stroke: #C2410C; stroke-width: 2; }
  .page { fill: #FFFFFF; stroke: #D1D5DB; stroke-width: 1.5; }
  .box-tm { fill: #EFF4FF; stroke: #C7D7FE; stroke-width: 1.5; }
  .bar { fill: #D1D5DB; }
  .bar-tm { fill: #A9C1F5; }
  .card { fill: #E5E7EB; }
  .card-h { fill: #FDBA8C; }
  .slot-h { fill: none; stroke: #C2410C; stroke-width: 1.5; stroke-dasharray: 4 3; }
  .icon { fill: none; stroke: #374151; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .icon-h { fill: none; stroke: #C2410C; stroke-width: 2; stroke-linejoin: round; }
  .edge { fill: none; stroke: #374151; stroke-width: 2; }
  .edge-agent { fill: none; stroke: #C2410C; stroke-width: 2.5; }
  .drag { fill: none; stroke: #C2410C; stroke-width: 1.5; stroke-dasharray: 4 3; }
  .head { fill: #374151; }
  .head-agent { fill: #C2410C; }
  @media (prefers-color-scheme: dark) {
    text { fill: #E6EDF3; }
    .lane-tm-label, .tm-text { fill: #79B8FF; }
    .lane-h-label, .agent-label, .h-text { fill: #FFA657; }
    .sub, .small, .edge-label { fill: #9DA7B3; }
    .region { fill: #161B22; stroke: #30363D; }
    .lane-tm { fill: #0F2240; stroke: #1F3A66; }
    .lane-h { fill: #2A1A0C; stroke: #5A3412; }
    .op-tm { fill: #0D1117; stroke: #58A6FF; }
    .op-h { fill: #0D1117; stroke: #F0883E; }
    .page { fill: #0D1117; stroke: #30363D; }
    .box-tm { fill: #0F2240; stroke: #1F3A66; }
    .bar { fill: #30363D; }
    .bar-tm { fill: #2F5A9E; }
    .card { fill: #30363D; }
    .card-h { fill: #9A4A16; }
    .slot-h, .drag, .icon-h { stroke: #F0883E; }
    .icon, .edge { stroke: #9DA7B3; }
    .edge-agent { stroke: #F0883E; }
    .head { fill: #9DA7B3; }
    .head-agent { fill: #F0883E; }
  }
</style>
<defs>
  <marker id="head" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head" d="M 0 0 L 10 5 L 0 10 Z"/></marker>
  <marker id="head-agent" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-agent" d="M 0 0 L 10 5 L 0 10 Z"/></marker>
</defs>

<!-- Regions and lanes -->
<rect class="region" x="48" y="48" width="248" height="264" rx="12"/>
<rect class="region" x="328" y="48" width="800" height="504" rx="12"/>
<rect class="region" x="1160" y="48" width="328" height="504" rx="12"/>
<rect class="lane-tm" x="344" y="104" width="768" height="208" rx="10"/>
<rect class="lane-h" x="344" y="328" width="768" height="208" rx="10"/>
<text class="h1" x="72" y="86">Your accounts</text>
<text class="edge-label" x="72" y="114">read-only</text>
<text class="h1" x="352" y="86">Your machine</text>
<text class="h1" x="1184" y="86">Notion</text>
<text class="lane-tm-label" x="360" y="136">Todo Manager</text>
<text class="lane-h-label" x="360" y="360">Hermes</text>

<!-- Sources -->
<g aria-label="Gmail">
  <rect class="icon" x="78" y="155" width="36" height="26" rx="3"/>
  <path class="icon" d="M 80 158 L 96 171 L 112 158"/>
  <text class="item" x="128" y="177">Gmail</text>
</g>
<g aria-label="Slack">
  <rect class="icon" x="80" y="204" width="32" height="32" rx="7"/>
  <path class="icon" d="M 91 212 L 89 228 M 103 212 L 101 228 M 85 217 L 107 217 M 84 223 L 106 223"/>
  <text class="item" x="128" y="229">Slack</text>
</g>
<g aria-label="GitHub">
  <circle class="icon" cx="88" cy="260" r="4"/>
  <circle class="icon" cx="88" cy="286" r="4"/>
  <circle class="icon" cx="106" cy="266" r="4"/>
  <path class="icon" d="M 88 264 L 88 282 M 106 270 Q 106 280 92 283"/>
  <text class="item" x="128" y="281">GitHub</text>
</g>
<path class="edge" d="M 244 152 Q 256 152 256 164 L 256 208 Q 256 220 268 220 Q 256 220 256 232 L 256 276 Q 256 288 244 288" stroke-width="1.5"/>

<!-- Edges (drawn under operators) -->
<line class="edge" x1="268" y1="220" x2="375" y2="220" marker-end="url(#head)"/>
<line class="edge" x1="476" y1="264" x2="476" y2="403" marker-end="url(#head)"/>
<text class="edge-label" x="464" y="390" text-anchor="end">if new</text>
<line class="edge" x1="656" y1="404" x2="656" y2="265" marker-end="url(#head)"/>
<text class="edge-label" x="668" y="390">task changes</text>
<line class="edge" x1="841" y1="220" x2="903" y2="220" marker-start="url(#head)" marker-end="url(#head)"/>
<line class="edge" x1="1105" y1="220" x2="1183" y2="220" marker-start="url(#head)" marker-end="url(#head)"/>
<path class="edge-agent" d="M 808 264 L 808 448 L 871 448" marker-end="url(#head-agent)"/>
<text class="agent-label" x="820" y="390">delegate</text>
<line class="edge-agent" x1="1040" y1="404" x2="1040" y2="265" marker-end="url(#head-agent)"/>
<text class="agent-label" x="1028" y="368" text-anchor="end">results,</text>
<text class="agent-label" x="1028" y="390" text-anchor="end">questions</text>

<!-- Todo Manager operators -->
<rect class="op-tm" x="376" y="176" width="200" height="88" rx="8"/>
<text class="title" x="476" y="214">Wake gate</text>
<text class="sub" x="476" y="244">every 5 min, no LLM</text>
<rect class="op-tm" x="640" y="176" width="200" height="88" rx="8"/>
<text class="title" x="740" y="214">Local store</text>
<text class="sub" x="740" y="244">SQLite database</text>
<rect class="op-tm" x="904" y="176" width="200" height="88" rx="8"/>
<text class="title" x="1004" y="214">Notion sync</text>
<text class="sub" x="1004" y="244">your edits win</text>

<!-- Hermes operators -->
<rect class="op-h" x="392" y="404" width="272" height="88" rx="8"/>
<text class="title" x="528" y="442">LLM judge</text>
<text class="sub" x="528" y="472">yours? due? done?</text>
<text class="edge-label" x="528" y="522" text-anchor="middle">others kept, with a reason</text>
<rect class="op-h" x="872" y="404" width="232" height="88" rx="8"/>
<text class="title" x="988" y="442">Kanban agent</text>
<text class="sub" x="988" y="472">drafts, research, docs</text>

<!-- Notion: home page -->
<rect class="page" x="1184" y="104" width="280" height="208" rx="6"/>
