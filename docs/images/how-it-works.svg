<rect class="bar-tm" x="1212" y="418" width="200" height="6" rx="3"/>
<rect class="bar-tm" x="1212" y="430" width="150" height="6" rx="3"/>
<text class="small" x="1200" y="472" font-style="italic">your notes</text>
<rect class="bar" x="1300" y="464" width="148" height="6" rx="3"/>
<path class="icon-h" d="M 1201 488 L 1213 488 L 1218 493 L 1218 510 L 1201 510 Z"/>
<text class="h-text" x="1228" y="506">Result page</text>

<!-- Legend -->
