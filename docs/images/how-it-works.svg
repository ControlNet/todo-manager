<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="600" viewBox="0 0 1536 600" role="img" aria-labelledby="title desc">
<title id="title">How Todo Manager works</title>
<desc id="desc">Gmail, Slack and GitHub are read by Todo Manager's wake gate every five minutes. Only new material wakes the Hermes LLM judge, which writes task changes to the local store. Notion sync keeps the store and the Notion home and task pages in step, and the optional Web UI shows the same tasks and actions in any browser. A card moved to Agent work is delegated to a Hermes Kanban agent, whose results and questions come back to the store and so to Notion and the Web UI.</desc>
<style>
  text { font-family: 'Times New Roman', Times, 'Liberation Serif', 'Nimbus Roman', serif; fill: #111827; }
  .h1 { font-size: 28px; font-weight: 700; }
  .lane-tm-label { font-size: 24px; font-weight: 700; fill: #1D4ED8; }
  .lane-h-label { font-size: 24px; font-weight: 700; fill: #B45309; }
  .title { font-size: 26px; font-weight: 700; text-anchor: middle; }
  .sub { font-size: 20px; fill: #4B5563; text-anchor: middle; }
  .item { font-size: 26px; }
  .small { font-size: 20px; fill: #4B5563; }
  .edge-label { font-size: 20px; font-style: italic; fill: #4B5563; }
  .agent-label { font-size: 20px; font-style: italic; fill: #B45309; }
  .page-title { font-size: 22px; font-weight: 700; }
  .tm-text { font-size: 20px; fill: #1D4ED8; }
  .h-text { font-size: 20px; fill: #B45309; }
  .region { fill: #F9FAFB; stroke: #D1D5DB; stroke-width: 1.5; }
  .lane-tm { fill: #EFF4FF; stroke: #C7D7FE; stroke-width: 1.5; }
  .lane-h { fill: #FFF4EA; stroke: #FAD2AE; stroke-width: 1.5; }
  .op-tm { fill: #FFFFFF; stroke: #1D4ED8; stroke-width: 2; }
  .op-h { fill: #FFFFFF; stroke: #C2410C; stroke-width: 2; }
  .page { fill: #FFFFFF; stroke: #D1D5DB; stroke-width: 1.5; }
  .box-tm { fill: #EFF4FF; stroke: #C7D7FE; stroke-width: 1.5; }
  .bar { fill: #D1D5DB; }
  .bar-tm { fill: #A9C1F5; }
  .card { fill: #E5E7EB; }
  .card-h { fill: #FDBA8C; }
  .slot-h { fill: none; stroke: #C2410C; stroke-width: 1.5; stroke-dasharray: 4 3; }
  .icon { fill: none; stroke: #374151; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .icon-h { fill: none; stroke: #C2410C; stroke-width: 2; stroke-linejoin: round; }
  .edge { fill: none; stroke: #374151; stroke-width: 2; }
  .edge-agent { fill: none; stroke: #C2410C; stroke-width: 2.5; }
  .drag { fill: none; stroke: #C2410C; stroke-width: 1.5; stroke-dasharray: 4 3; }
  .head { fill: #374151; }
  .head-agent { fill: #C2410C; }
  .b-done { fill: #DBEDDB; } .b-agent { fill: #E8DEEE; } .b-snooze { fill: #E3E2E0; }
  .b-wait { fill: #FDECC8; } .b-cancel { fill: #FFE2DD; }
  @media (prefers-color-scheme: dark) {
    text { fill: #E6EDF3; }
    .lane-tm-label, .tm-text { fill: #79B8FF; }
    .lane-h-label, .agent-label, .h-text { fill: #FFA657; }
    .sub, .small, .edge-label { fill: #9DA7B3; }
    .region { fill: #161B22; stroke: #30363D; }
    .lane-tm { fill: #0F2240; stroke: #1F3A66; }
    .lane-h { fill: #2A1A0C; stroke: #5A3412; }
    .op-tm { fill: #0D1117; stroke: #58A6FF; }
    .op-h { fill: #0D1117; stroke: #F0883E; }
    .page { fill: #0D1117; stroke: #30363D; }
    .box-tm { fill: #0F2240; stroke: #1F3A66; }
    .bar { fill: #30363D; }
    .bar-tm { fill: #2F5A9E; }
    .card { fill: #30363D; }
    .card-h { fill: #9A4A16; }
    .slot-h, .drag, .icon-h { stroke: #F0883E; }
    .icon, .edge { stroke: #9DA7B3; }
    .edge-agent { stroke: #F0883E; }
    .head { fill: #9DA7B3; }
    .head-agent { fill: #F0883E; }
    .b-done { fill: #2B593F; } .b-agent { fill: #492F64; } .b-snooze { fill: #4A4A4A; }
    .b-wait { fill: #89632A; } .b-cancel { fill: #6E3630; }
  }
</style>
<defs>
  <marker id="head" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head" d="M 0 0 L 10 5 L 0 10 Z"/></marker>
  <marker id="head-agent" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-agent" d="M 0 0 L 10 5 L 0 10 Z"/></marker>
</defs>

