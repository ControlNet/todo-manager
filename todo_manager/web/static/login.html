<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Todo Manager</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/static/icons/icon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/static/icons/icon-180.png">
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/login.css">
<script src="/static/theme.js"></script>
</head>
<body>
<main class="login">
  <form method="post" action="/login" class="login-card">
    <div class="brand"><span class="logo"><svg viewBox="0 0 64 64" width="32" height="32" aria-hidden="true"><path d="M19 33l9 9 17-19" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>Todo Manager</span></div>
    <label class="field">
      <span class="label" id="token-label">Password</span>
      <input name="token" type="password" autocomplete="current-password" required autofocus aria-labelledby="token-label">
    </label>
    <p class="login-failed" id="failed" hidden></p>
    <button class="btn primary" type="submit" id="submit">Sign in</button>
  </form>
</main>
<script src="/static/login.js"></script>
</body>
</html>
